# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: boter
email: boter42@protonmail.com
description: >- # this means to ignore newlines until "baseurl:" Add your site description here in the _config.yml file. It will appear in your document head meta (for Google search results) and title of the website (in browser tabs).
  Qui ci si diverte fino al 2022.

baseurl: "" # the subpath of your site, e.g. /blog. leave blank if this is your main github pages repository
url: "https://boter.eu" # the base hostname & protocol for your site, e.g. http://example.com


# Build settings
theme: jekyll-theme-image-grid
# The theme gem ships a demo _config.yml (author: "author", post title/date on,
# placeholder social links) that Jekyll would merge into this one. Skip it.
ignore_theme_config: true

# generate social links in footer
social_links:
  twitter: ORARiccardo
  # github: 
  # facebook: 
  # instagram:
  # linkedin: 
  # pinterest: 
  # youtube:
  # youtube_channel: 
  # youtube_channel_name:

  # Mastodon instances
  # mastodon:
  # - username: jekyll
  #   instance: example.com
  # - username: jekyll2
  #   instance: example.com

collections:
  medium:
    output: true
  work:
    output: true

defaults:
  - scope:
      path: ""
      type: "medium"
    values:
      layout: "works"
  - scope:
      path: ""
      type: "work"
    values:
      layout: "work"

plugins:
  - jekyll-seo-tag

# Anything listed here is kept out of the published site. Setting "exclude" REPLACES
# Jekyll's defaults, so the defaults are repeated below alongside our own entries.
exclude:
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - bin
  - CLAUDE.md
  - git_push_guide.txt
  - README.md
  - Gemfile
  - Gemfile.lock
  - gemfiles
  - node_modules
  - package-lock.json
  - vendor
